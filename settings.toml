# OmniSportsSwitch default settings. You do not need to edit this file: change settings in the extension popup
# (Settings section). They apply at once and are kept in settings.local.json, which is layered on top of this file.
# This file is read when the daemon starts and must always equal the built-in defaults (a test checks it).
# A typo or wrong value is ignored with a warning in logs\events.log; it never stops the daemon.

[scoring]
# A challenger must beat the stream it replaces by this fraction AND by at least min_gap in score...
threshold = 0.40
min_gap = 0.15
# ...and a challenger scoring below this never wins (loudness alone cannot reach it).
min_score = 0.35
window_s = 3.0       # loudness is averaged over this many seconds
baseline_s = 60.0    # each stream's "normal loudness" is averaged over about this long
warmup_s = 20.0      # a new stream cannot win (or be compared) until it has been seen this long
surge_cap = 1.0      # limit of the loudness-surge signal (1.0 = loudness doubled)
event_s = 45.0       # how long a goal / touchdown boosts a stream (fading)
confirm_s = 2.0      # a challenger must keep qualifying this long before it takes over (one applause reading is not enough)
min_dwell_s = 20.0   # minimum time between two swaps
stale_s = 5.0        # a stream with no audio for this long is ignored
idle_music = 0.5     # MAIN counts as showing an ad when music probability is at least this
dead_quiet_level = 0.15  # crowd and rise in loudness both below this = a quiet sound (a frozen clock then counts as dead time sooner, see [sports])
audio_ad_margin = 0.15  # ...and music must exceed speech by this much (music under commentary is not an ad)
audio_ad_votes = 3     # a music-only ad needs this many music readings...
audio_ad_window = 5    # ...among the last this many (a single reading is never enough)
classifier_target_rms = 0.0   # above 0: the sound is levelled to this normal loudness (try 0.05) before the crowd/speech/music classifier hears it; 0 = off
speech_interval_s = 3.0       # the commentary listener (measuring only: it only logs) transcribes each stream this often; 0 = off
speech_window_s = 8.0         # ...the last this many seconds of sound
semantic_min_sim = 0.85       # semantic reading of the commentary (measuring only): this similar to the high / mid reference phrases counts...
semantic_mid_sim = 0.99       # ...mid level: effectively off (0 of 5 mid alarms were true in Como-Roma)
semantic_margin = 0.10        # ...and must beat the similarity to ordinary match talk by this much
speech_cue_cooldown_s = 20.0  # the same spoken cue on the same stream is logged at most this often
speech_cue_factor = 1.0       # soccer: a spoken free kick / chance / post / penalty / goal call counts this much of the banner cue (0 = off)
speech_veto_shadow = 1        # 1 = log what the learned spoken-cue veto would drop (`speech veto` lines; shadow only, it changes no cue, score or swap), 0 = off
speech_veto_threshold = 0.39  # ...a cue is "would_veto" when the mean of its two models (P a real moment is called now) is below this
classifier_max_gain = 8.0     # ...by at most this factor up or down
feed_mode = 0           # outside game data (ESPN): 0 = local only, nothing starts; 1 = record only (measuring, changes no score); needs a daemon restart
ocr_assist = 1         # 1 = a second OCR reader (PaddleOCR through rapidocr-onnxruntime, CPU) fills in a score or clock the first reader missed on a tile whose scorebug is on screen, 0 = off
ocr_assist_gpu = 1         # 1 = run the second reader on the GPU (DirectML, about 2.6x faster; needs `pip install onnxruntime-directml` in place of onnxruntime), 0 = CPU
touchdown_banner_interval_s = 2.0   # American football on a multiplex-flagged tab (NFL RedZone): the second reader looks at the lower part of the video for the TOUCHDOWN banner this often (0 = off)
touchdown_banner_all_tabs = 0      # 1 = every American football tab gets that look, not only the multiplex ones
touchdown_banner_votes = 2         # banner readings needed...
touchdown_banner_window_s = 6.0    # ...within this long
touchdown_banner_cooldown_s = 30.0 # per tile (the banner lasts about 4 s)
touchdown_banner_strength = 0.9    # the banner counts as this fraction of a touchdown (fading) until the score itself changes (then it is a full goal)
ocr_assist_retry_s = 3.0   # ...and looks again this often on a tile where it found nothing
dataset_mode = 1        # 1 = record one row per stream every 2 s (and the events) to logs/dataset/ for later learning, 0 = off; takes effect at once
log_archive_days = 90   # rotated log files are copied (gzip) to logs/archive/<date>/ and kept this many days (0 = forever)
log_archive_max_mb = 50000  # ...and the archive never grows beyond this many MB, the oldest files go first (0 = no cap)
feed_poll_s = 5.0       # a league with a live game is asked this often (never less than 5 s)
feed_idle_poll_s = 120.0  # a league with nothing live or starting soon is asked this often
feed_summary_s = 10.0   # American football: the plays of each live game are fetched this often; 0 = off
feed_unconfirmed_factor = 0.8  # BOTH mode: an OCR score change on a mapped game that no feed event preceded counts this much until the feed confirms it (1.0 = off)
feed_confirm_s = 30.0   # ...and the feed has this long after the OCR change to confirm it
feed_event_weight = 0.0  # a feed goal/touchdown on a mapped game counts this much of its strength (0 = only logged, 1 = full)
feed_lead_s = 10.0      # shadow gate: an event 'would fire' when the stream clock is this many seconds before it (measuring only)
buildup_mode = 1.0      # build-up tracker (measuring only, changes no score): 0 = off, 1 = log "buildup would take MAIN" lines
buildup_live = 1.0      # football only: 1 = a stream that reaches the build-up level really takes MAIN (Scorer.take_main), 0 = log only
buildup_window_s = 60.0 # the cues of a stream are added up for this long (each fading to 0), not only the strongest one
buildup_min = 0.38      # a stream not in MAIN "would take" it when its build-up level (faded cue sum + surge/crowd) reaches this...
buildup_cooldown_s = 30.0  # ...and is min_gap above MAIN's score; one line per stream this often
buildup_surge_min = 0.6 # soccer, measuring only: a loudness surge this high notes a small pseudo-cue in the build-up (never a score)...
buildup_surge_note = 0.10  # ...of this value, at most once per buildup_cooldown_s per stream
buildup_gap = 0.10       # the tracker's own 'above MAIN' gap (min_gap, 0.15, stays for the normal rule)
buildup_crowd_min = 0.25 # football: a stream whose crowd probability stays this high on 3 consecutive score readings (1 s apart)...
goal_hold_s = 40.0       # build-up tracker: MAIN keeps its place this long after a goal on it (score change or goal banner; 0 = off)...
goal_hold_extend_s = 10.0   # ...and longer while a replay sign (replay over the scorebug, hidden scorebug, replay by clock, spoken replay) is seen: until its time + this...
goal_hold_max_s = 75.0   # ...but never longer than this after the goal
goal_hold_break = 0.8    # a challenger scoring at least this (a goal or a very big moment) still takes MAIN during the hold
goal_hold_break_level = 0.55   # ...or (build-up tracker) a build-up level this high WITH a spoken cue younger than goal_hold_break_cue_s (0 = off)
goal_hold_break_cue_s = 15.0
goal_bypass_dwell = 1.0   # 1 = a challenger with a fresh goal of its own (event >= goal_hold_break_event) skips min_dwell_s in decide() (confirm_s still applies); 0 = off
hot_game_s = 90.0   # 'hot game': after MAIN's own goal or a strong cue (review, penalty awarded) on it, MAIN stays hot this long (0 = off; ends if MAIN goes to an ad / break)...
hot_game_max_s = 150.0   # ...hard cap on one hot episode, counted from its FIRST goal / strong cue (more cues extend it up to here only); a break or ad ends it for good
hot_game_margin = 0.25   # ...and a challenger must beat MAIN's score (build-up path: MAIN's score or build-up level) by this much, unless it has a fresh goal of its own or a review cue
goal_yield_s = 10.0   # build-up tracker: no swap to another stream while a goal (score change / goal banner) was seen on a third stream this recently, so the normal rule can take the goal (0 = off)
goal_hold_break_event = 0.5   # ...or a fresh score change / goal banner of its own this strong (a quiet stream that just scored scores ~0.74, below goal_hold_break)
buildup_hold_s = 25.0    # MAIN keeps its place this long after ITS OWN spoken/banner cue (chance, free kick, post area, penalty...; 0 = off): a challenger needs...
buildup_hold_cue_min = 0.15   # ...(a cue counts for the hold when its weight is at least this: surge/crowd/set-piece notes are 0.10, spoken cues 0.20-0.25)...
buildup_hold_margin = 0.20    # ...a build-up level this far above MAIN's own build-up level (instead of buildup_gap)
buildup_review_hold_s = 60.0  # a review (VAR check, penalty awarded: a cue of weight >= buildup_review_min) on MAIN holds it this long (never longer than buildup_window_s; 0 = off)...
buildup_review_min = 0.40     # ...(see above)
buildup_review_margin = 0.35  # ...and the challenger needs this much above MAIN's build-up level (a goal on the challenger is the normal swap rule, not held)
buildup_crowd_note = 0.10   # ...notes a pseudo-cue of this value into the tracker, at most once per buildup_cooldown_s (never a score)
surge_rise_min = 0.5     # soccer, rising-loudness cue (heard before the commentator's words): the loudness surge must be at least this...
surge_rise_ratio = 1.5   # ...and the level must have grown by this factor over the last surge_rise_window_s seconds...
surge_rise_window_s = 6.0   # ...(compared with a reading at least half this old)...
surge_rise_votes = 3     # ...on this many consecutive score readings (1 s apart)...
surge_rise_cooldown_s = 40.0   # ...and then not again for this long on the same stream
panel_goal_cue = 1       # the CANAL+ multiplex results panel (every game of the night, next to the video): 1 = a score going up in it is a strong cue on the tab, 0 = log only
panel_goal_stale_s = 45     # ...a panel row not seen for this long (a standings table or another graphic replaced the panel) only gets a new baseline when it returns: old news, no cue (0 = off)
panel_goal_repeat_s = 120   # ...and a goal to a score already reported for that game this recently (VAR took it back and gave it again) is the same goal (0 = off)
panel_goal_readings = 2  # ...a new panel score must be read identically this many times in a row (one misread digit never counts)
jingle_cue = 1           # the channel's goal jingle (needs models/jingle/jingle.npz, scripts/build_jingle_template.py): 1 = a hit is a strong cue on the tab, 0 = log only
jingle_min_score = 0.40  # ...match score (0 to 1, normalised correlation) a window needs; speech, crowd and other music stay under about 0.2...
jingle_votes = 2         # ...on this many windows in a row that agree where the sting ended (one reading is never enough)...
jingle_cooldown_s = 8.0  # ...then not again on the same tab for this long (audio time)
jingle_interval_s = 0.4  # how often each tab's recent audio is compared with the template
blowout_goal_bonus = 0.25   # a goal in a decided game adds this to its score, but only while every other stream is quiet (0 = off)
blowout_goal_lev = 0.3      # ...a game is decided when its leverage is at most minus this (-1 = late blowout)...
blowout_goal_event = 0.5    # ...the goal must still be this fresh (1 = just now)...
blowout_goal_quiet = 0.30   # ...quiet = every other live stream scores below this...
blowout_goal_cue = 0.25     # ...and has no cue at least this strong (a foul or corner is not busy)...
blowout_goal_floor = 0.40   # ...and the goal is then worth at least this score (soft floor, 0 = bonus only)
field_goal_strength = 0.6   # American football: a field goal or safety counts this much of a touchdown (1.0 = same)
extra_point_s = 30.0    # an extra point or two-point conversion this soon after a touchdown is not a new event
anticipation_s = 18.0       # a cue boosts a stream this long (fading)
cue_alone_cap = 0.30        # a cue with no other sign of excitement adds at most this (below min_score)
cue_support = 0.10          # crowd + surge + shouting + score change worth this much lift that cap
touchdown_pair_surge = 0.30 # American football: a spoken touchdown call is a STRONG cue (counts in full) with a loudness surge this big...
touchdown_pair_window_s = 6.0   # ...at most this long before or after the call (0 = off; user 2026-10-18)
cue_leverage_gain = 0.5     # a cue is worth x(1 + gain * leverage): up to x1.5 in a late close game, x0.5 in a blowout
cue_speech_window_s = 20.0  # commentary heard this recently tells what a bare review is about
goal_banner_strength = 0.4  # soccer: a GOAL banner counts as this fraction of a goal (fading) until a real score change takes it to 1.0
goal_phrase_surge = 0.6     # MEASURING ONLY: a goal phrase heard with a loudness surge at least this big is logged as "would fire"
goal_phrase_window_s = 10.0 # ...when the two are at most this many seconds apart
cue_zone_near_yd = 3.0      # at this many yards from the end zone or closer a cue has its highest weight
cue_zone_far_yd = 10.0      # at this many or more it has its lowest
anticipation_cooldown_s = 30.0   # the same cue is not reported again this soon
anticipation_big_gain_yd = 20.0  # a "+NN YDS" graphic is a cue from this many yards
anticipation_goal_yd = 10.0      # a yard line graphic (beside a down text) is a cue up to this many yards
replay_by_clock_s = 0.0       # a game clock that goes back 10-30 s with the scorebug visible is a replay: 0 = only logged, above 0 = also treated as a replay for this long (try 20)
replay_clock_min_s = 10.0     # the smallest step back that counts
football_clock_back_s = 90.0    # football: a game clock this far BELOW the last real one is a replay / highlights (not 45:00 of the 2nd half), not the live clock
football_clock_ahead_s = 900.0   # ...and one this far ABOVE what the last real one plus the elapsed time allows is another match's scorebug
foreign_clock_accept_s = 300.0   # ...unless it keeps running like that for this long (you rewound or skipped the stream): then it is believed
replay_clock_max_s = 30.0     # the largest step back that counts (more is the viewer rewinding)
scorebug_hidden_s = 6.0   # measuring only: a scorebug missing this long is logged as 'scorebug hidden' (DAZN hides it in replays)
scorebug_memory_s = 60.0  # ...if it was seen within this long before the gap
replay_dampen = 0.3     # during a replay inside a live game, crowd noise and loudness count this much (the replay's old cheers)
recent_ad_s = 30.0     # an idle MAIN is not handed to a stream that was on an ad this recently (stops hopping between ads)
new_game_readings = 3   # multiplex tabs (flagged in the popup): a different pair of team codes read this many times in a row is a new game and resets that video's score, clock, game state and goal memory
held_change_s = 30.0   # a score change read while the game looked like a break is kept this long and counts if the game is live again (0 = drop it at once)
rewind_high_slack_s = 120.0   # a stream cannot be ahead of the feed clock: a rewind high point (or reading) more than this many seconds above the feed's current game time is a scrub/misread and is dropped (0 = no cap; no fresh feed clock = no cap)
rewind_ignores_score = 1.0   # 1 = a score change on a tile whose stream is replaying its past (feed rewind) makes no event, goal hold or swap bonus unless the feed shows that score at the stream clock (0 = old behaviour: counted)
ad_sticky_s = 120.0        # a picture ad break stays an ad this long unless the scoreboard is read again (0 = only the short 8 s memory)
ad_exit_readings = 3       # ...this many scoreboard readings (down/quarter, clock with a team code, two team codes) end it
audio_ad_memory_s = 12.0   # a stream that sounded like an ad stays flagged this long (the music probability flickers)
goal_pending_s = 6.0         # a first new-score reading (before the vote) backs the goal-music exemption this long unless the vote confirms it (0 = off)
goal_pending_surge = 0.5    # ...only with a clear surge (loudness over normal) or...
goal_pending_crowd = 0.3    # ...this crowd-like within audio_ad_goal_s before it (a misread in a quiet game or an ad changes nothing)
audio_ad_goal_s = 20.0     # music within this long of a goal (score change, GOAL banner, feed goal; either order) is the celebration, not an ad (0 = off)
big_play_strength = 0.7   # a big play (banner like TAKEAWAY!) counts this much of a goal (1.0 = same as a goal)
ad_penalty = 0.5     # an ad in the picture scores -0.5 (music-only: half of it), so it is pushed down, not just ignored
leverage_weight = 0.3   # closeness and time left: a late close game adds up to this to its score, a late blowout takes it away
lev_us_football_close = 8.0     # points apart that count as close (one score) in American football...
lev_us_football_blowout = 28.0  # ...and as a blowout (more than three touchdowns)
lev_soccer_close = 1.0
lev_soccer_blowout = 4.0
manual_hold_s = 60.0    # "Make Main" in the popup holds the stream on MAIN this long (seconds)
manual_hold2_s = 60.0   # "Make Window 2" in the popup holds the stream in Window 2 (internal LEFT) this long (seconds); no swap moves Window 2 meanwhile
hold_over_s = 60.0    # a held stream whose game has looked over for this long loses the hold
hold_break_score = 1.2  # a challenger scoring at least this still takes MAIN from a held stream

[weights]
# score = surge*w + crowd*w + speech*w + music*w + event*w, plus the favourite bonus
surge = 0.3          # loudness above the stream's own normal
crowd = 1.0          # cheering / crowd / applause sound
speech = -0.2        # commentary (negative: talking is not excitement)
music = -0.5         # music, ads and jingles (negative)
event = 0.8          # a fresh goal / touchdown read from the scoreboard
anticipation = 1.0   # master scale of the cues before a likely score (red zone, VAR, corner...), 0 = off (they are only logged)
cue_review_top = 0.50    # a review (VAR, challenge) of a possible goal / touchdown, a penalty kick or a red card
cue_review_high = 0.35   # ...of an interception, fumble or turnover
cue_review_mid = 0.20    # ...of offside, pass interference or a foul
cue_review_low = 0.10    # ...with no subject known
cue_chance = 0.25        # red zone, goal to go, field goal attempt, penalty kick (soccer)
cue_minor = 0.10         # corner, flag, 4th down, big gain, added time, timeout...
cue_free_kick = 0.25     # a free kick (soccer): the user finds minor (0.10) too low
panel_goal_cue_weight = 0.40   # a game of the CANAL+ multiplex results panel went up by a goal (a strong tab-level cue, like the jingle but weaker)
jingle_cue_weight = 0.50   # the channel's goal jingle heard (a strong cue: a goal was just scored in some game of the channel); default = cue_review_top
cue_surge_rise = 0.20    # soccer: the crowd noise is rising fast (a medium cue, heard BEFORE the commentator's words); 0 = off
cue_zone_far = 0.15      # American football: a goal-to-go / yard line cue with the ball ~10 yards from the end zone
cue_zone_near = 0.40     # ...and 1-3 yards from it (or a 4th down at the goal line); no distance read = cue_chance
shout = 0.0          # shouting / yelling / screaming (0 = off; try 0.2 after checking it on live games)
favourite = 0.4      # steady bonus per +1 of a favourite team's multiplier (x2 team = +0.4)

[multiview]
# Which tile of a DAZN multiview tab gets the sound / becomes the big one.
switch_ratio = 1.5   # another tile must beat the current one by this factor
min_dwell_s = 30.0   # minimum time between tile changes in one tab
event_weight = 1.0
crowd_weight = 1.0
floor = 0.05         # every live tile has at least this much interest
ad_penalty = 0.5     # a tile showing an ad gets negative interest, so focus moves off it

[banners]
# Text a streaming player shows while an ad break is on (matched anywhere inside a text item, any case). It must
# appear on two readings in a row. Add the wording your services use, in any language.
break_phrases = ["commercial break", "publicitaria", "intervalo comercial", "publicité", "publicite", "publicitaire", "publicidade", "pausa comercial", "ad break", "advertisement", "right back", "volvemos", "de retour dans", "watch now", "ondazn", "event break", "evento em intervalo", "interrupcion del evento", "interrupción del evento", "stream live matches", "schedule for availability"]
# Promo screens between games (DAZN). They count as an ad only when NO scoreboard is on screen: a live game frame shows "US advertising" or a Game Pass logo beside its scorebug.
promo_phrases = ["advertising", "on dazn", "nfl game pass", "watchevery", "daznboxing", "dazn boxing"]

# Banners flashed for a big play. A text item counts when it is just that phrase (a few extra characters are
# allowed), so sentences and stat labels like "TURNOVERS" do not trigger it.
big_play_words = ["takeaway", "interception", "intercepted", "fumble", "sack", "red card", "carton rouge", "penalty kick"]

# Banners of a replay (English, French, Spanish, Portuguese), same rule: the text must be just that phrase. A replay over a live
# scorebug has its crowd noise dampened and its graphics ignored; a replay with no scorebug (studio show) counts as a break.
anticipation_words = ["red zone", "goal to go", "two minute warning", "two-minute warning", "field goal", "field goal attempt", "penalty", "flag", "flag on the play", "review", "under review", "replay review", "challenge", "big play", "var", "var check", "free kick", "corner", "corner kick", "penalty shootout", "avertissement de deux minutes", "tir de placement", "pénalité", "pénalty", "drapeau", "révision", "contestation", "assistance vidéo", "coup franc", "tir au but", "tirs au but", "penalti", "tiro libre", "saque de esquina", "escanteio", "tiro livre", "pênalti", "timeout", "temps mort"]
replay_words = ["replay", "instant replay", "action replay", "slo-mo", "slow motion", "ralenti", "reprise", "reprise vidéo", "reprise video", "repetición", "repeticion", "ralentí", "câmera lenta", "camera lenta", "cámara lenta", "camara lenta", "repetição", "repeticao"]

# When does a stopped game clock mean a break?  freeze_s: clock unchanged this long.  no_clock_s: scoreboard
# without a readable clock this long. Soccer's clock only stops at half-time; American football
# stops it constantly, so it allows much longer.
[sports.football]
freeze_s = 20
no_clock_s = 45

[sports."american football"]
freeze_s = 90          # a stopped clock for this long is a break (a medical timeout or a TV break lasts minutes; user 2026-10-18, was 240)
quiet_freeze_s = 45    # ...or this long when the sound has also been quiet all that time (0 = off)
no_clock_s = 90

[sports.generic]       # any other or unknown sport
freeze_s = 120
no_clock_s = 60


# Per-sport overrides (file only; the popup shows and edits the shared values above). A sport may list ONLY the values that differ
# from the shared ones, in its own table: [scoring.football], [weights.football], [scoring."american football"], [weights."american football"].
# The sports are football (soccer), "american football"; any other or unknown sport uses the shared values. Only
# per-stream values may be overridden (all [weights]; of [scoring] the swap margins, cue, leverage, goal hold and build-up values; the
# list is OVERRIDABLE_SCORING in daemon/scoring.py); a server-wide key is ignored with a warning. A shared value changed in the popup
# still reaches every sport that does not override it. Only one override ships (below, American football speech); a test checks the rest equals the defaults.
# [scoring.football]
# buildup_min = 0.40
# [weights.football]
# cue_chance = 0.30
[weights."american football"]
speech = -0.1   # commentary costs half as much: the touchdown call is spoken over the crowd (2026-10-18 audio analysis, 20 of 43 calls reach 0.35 instead of 6)
