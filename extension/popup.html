<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 400px; margin: 0; padding: 10px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 12px; margin: 10px 0 4px; text-transform: uppercase; color: #555; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row .grow { flex: 1; min-width: 0; }
  .tab { border: 1px solid #ddd; border-radius: 6px; padding: 6px; margin-bottom: 6px; }
  .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role { font-weight: 600; }
  input[type=number] { width: 56px; }
  input[type=text] { min-width: 0; }
  button { cursor: pointer; }
  #track, #freeze { width: 100%; margin-bottom: 8px; }
  #freeze.on { background: #c62828; color: #fff; }
  .hint { color: #666; margin-top: 6px; }
  .slots { flex-wrap: wrap; font-size: 11px; gap: 8px; }
  .slots label { white-space: nowrap; }
  summary { cursor: pointer; font-weight: 600; margin-top: 8px; }
</style>
<h1>OmniSportsSwitch</h1>
<div class="row"><span>This window is</span><select id="windowRole"></select></div>
<button id="freeze">Freeze MAIN (Ctrl+Shift+P)</button>
<button id="track" hidden>Track this tab</button>
<div id="list"></div>

<details>
  <summary>Priorities (sports and favourite teams)</summary>
  <h2>Sport weights</h2>
  <div id="sports"></div>
  <div class="row"><input id="newSport" type="text" placeholder="New sport" class="grow"><button id="addSport">Add</button></div>
  <h2>Favourite teams (bonus multiplier)</h2>
  <div class="hint">Use the short name shown on the scoreboard (PSG, NAP...). A live favourite stays on MAIN unless something exciting happens elsewhere.</div>
  <div id="teams"></div>
  <div class="row"><input id="newTeam" type="text" placeholder="Team name, e.g. Paris SG" class="grow">
    <input id="newTeamMult" type="number" min="0" step="0.1" value="2"><button id="addTeam">Add</button></div>
</details>

<div class="hint" id="hint"></div>
<button id="reload" style="margin-top:8px; width:100%">Reload extension (drops all tracking)</button>
<script src="defaults.js"></script>
<script src="popup.js"></script>
